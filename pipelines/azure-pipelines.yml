# ===================================================================================
# AZURE DEVOPS PIPELINE — Deploy da Landing Page + Function + Infra
# ===================================================================================
#
# Este pipeline faz o deploy completo da solução:
# 1. Provisiona infra via Bicep (Cosmos DB, ACR, Container App, Function)
# 2. Builda e pusha a imagem Docker para o ACR
# 3. Deploya a Azure Function
# 4. Atualiza o Container App com a nova imagem
#
# PRÉ-REQUISITOS no Azure DevOps:
# - Service Connection chamada "azure-marketplace" com acesso à subscription
# - Variable Group chamada "marketplace-vars" com:
#   - AZURE_SUBSCRIPTION_ID
#   - RESOURCE_GROUP_NAME
#   - APP_NAME (ex: saas-landing)
#   - LOCATION (ex: eastus2)
#
# ===================================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - function/**
      - infra/**
      - Dockerfile
      - pipelines/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: marketplace-vars
  - name: acrName
    value: ''  # Preenchido dinamicamente pelo output do Bicep

stages:

# ==========================================================================
# STAGE 1: Provisionar Infraestrutura (Bicep)
# ==========================================================================
- stage: Infrastructure
  displayName: '🏗️ Provisionar Infraestrutura'
  jobs:
  - job: DeployInfra
    displayName: 'Deploy Bicep'
    steps:
    - task: AzureCLI@2
      displayName: 'Criar Resource Group'
      inputs:
        azureSubscription: 'azure-marketplace'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az group create \
            --name $(RESOURCE_GROUP_NAME) \
            --location $(LOCATION)

    - task: AzureCLI@2
      name: deployBicep
      displayName: 'Deploy Bicep Templates'
      inputs:
        azureSubscription: 'azure-marketplace'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          RESULT=$(az deployment group create \
            --resource-group $(RESOURCE_GROUP_NAME) \
            --template-file infra/main.bicep \
            --parameters appName=$(APP_NAME) \
            --query "properties.outputs" \
            --output json)

          # Extrair outputs do Bicep e exportar como variáveis do pipeline
          ACR_LOGIN_SERVER=$(echo $RESULT | jq -r '.acrLoginServer.value')
          CONTAINER_APP_URL=$(echo $RESULT | jq -r '.containerAppUrl.value')
          FUNCTION_APP_URL=$(echo $RESULT | jq -r '.functionAppUrl.value')

          echo "##vso[task.setvariable variable=ACR_LOGIN_SERVER;isOutput=true]$ACR_LOGIN_SERVER"
          echo "##vso[task.setvariable variable=CONTAINER_APP_URL;isOutput=true]$CONTAINER_APP_URL"
          echo "##vso[task.setvariable variable=FUNCTION_APP_URL;isOutput=true]$FUNCTION_APP_URL"

          echo "ACR: $ACR_LOGIN_SERVER"
          echo "Container App: https://$CONTAINER_APP_URL"
          echo "Function: $FUNCTION_APP_URL"

# ==========================================================================
# STAGE 2: Build e Push da imagem Docker
# ==========================================================================
- stage: BuildImage
  displayName: '🐳 Build Docker Image'
  dependsOn: Infrastructure
  variables:
    ACR_LOGIN_SERVER: $[ stageDependencies.Infrastructure.DeployInfra.outputs['deployBicep.ACR_LOGIN_SERVER'] ]
  jobs:
  - job: BuildAndPush
    displayName: 'Build & Push to ACR'
    steps:
    - task: AzureCLI@2
      displayName: 'Login no ACR + Build + Push'
      inputs:
        azureSubscription: 'azure-marketplace'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          # Login no ACR
          az acr login --name $(ACR_LOGIN_SERVER)

          # Build da imagem
          docker build -t $(ACR_LOGIN_SERVER)/landing-page:$(Build.BuildId) \
                       -t $(ACR_LOGIN_SERVER)/landing-page:latest \
                       .

          # Push para o ACR
          docker push $(ACR_LOGIN_SERVER)/landing-page:$(Build.BuildId)
          docker push $(ACR_LOGIN_SERVER)/landing-page:latest

# ==========================================================================
# STAGE 3: Deploy da Azure Function
# ==========================================================================
- stage: DeployFunction
  displayName: '⚡ Deploy Azure Function'
  dependsOn: Infrastructure
  variables:
    FUNCTION_APP_URL: $[ stageDependencies.Infrastructure.DeployInfra.outputs['deployBicep.FUNCTION_APP_URL'] ]
  jobs:
  - job: DeployFunc
    displayName: 'Deploy Function App'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - script: |
        cd function
        pip install -r requirements.txt --target=".python_packages/lib/site-packages"
      displayName: 'Instalar dependências da Function'

    - task: ArchiveFiles@2
      displayName: 'Zipar Function'
      inputs:
        rootFolderOrFile: 'function'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/function.zip'

    - task: AzureCLI@2
      displayName: 'Deploy Function via zip'
      inputs:
        azureSubscription: 'azure-marketplace'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          FUNC_NAME=$(az functionapp list \
            --resource-group $(RESOURCE_GROUP_NAME) \
            --query "[0].name" -o tsv)

          az functionapp deployment source config-zip \
            --resource-group $(RESOURCE_GROUP_NAME) \
            --name $FUNC_NAME \
            --src $(Build.ArtifactStagingDirectory)/function.zip

# ==========================================================================
# STAGE 4: Atualizar Container App com nova imagem
# ==========================================================================
- stage: DeployContainerApp
  displayName: '🚀 Deploy Container App'
  dependsOn:
    - Infrastructure
    - BuildImage
  variables:
    ACR_LOGIN_SERVER: $[ stageDependencies.Infrastructure.DeployInfra.outputs['deployBicep.ACR_LOGIN_SERVER'] ]
    CONTAINER_APP_URL: $[ stageDependencies.Infrastructure.DeployInfra.outputs['deployBicep.CONTAINER_APP_URL'] ]
  jobs:
  - job: UpdateContainerApp
    displayName: 'Update Container App Image'
    steps:
    - task: AzureCLI@2
      displayName: 'Atualizar imagem do Container App'
      inputs:
        azureSubscription: 'azure-marketplace'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          CA_NAME=$(az containerapp list \
            --resource-group $(RESOURCE_GROUP_NAME) \
            --query "[0].name" -o tsv)

          az containerapp update \
            --name $CA_NAME \
            --resource-group $(RESOURCE_GROUP_NAME) \
            --image $(ACR_LOGIN_SERVER)/landing-page:$(Build.BuildId)

          echo "==================================="
          echo "✅ Landing Page atualizada!"
          echo "URL: https://$(CONTAINER_APP_URL)"
          echo "==================================="
